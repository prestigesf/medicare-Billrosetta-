[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfs"
version = "0.1.0"
description = "Medicare Physician Fee Schedule rate calculation from CMS published data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pfs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
